<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Um cantinho para guardar todas as nossas receitas favoritas."
    >

    <title>Receitinhas ♡</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Nosso CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="header-content">

            <div class="brand">

                <span class="brand-icon">
                    ♡
                </span>

                <div>

                    <h1>
                        receitinhas
                    </h1>

                    <p>
                        receitas que valem guardar
                    </p>

                </div>

            </div>

        </div>

    </header>


    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <main class="main">


        <!-- =========================
             HERO
        ========================== -->

        <section class="hero">

            <span class="hero-decoration">
                ✦
            </span>

            <h2>
                O que vamos<br>
                cozinhar hoje?
            </h2>

            <p>
                Um cantinho para guardar todas aquelas
                receitas que a gente não quer perder.
            </p>

        </section>


        <!-- =========================
             BUSCA
        ========================== -->

        <section class="search-section">

            <div class="search-box">

                <span
                    class="search-icon"
                    aria-hidden="true"
                >
                    ⌕
                </span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Buscar uma receita..."
                    autocomplete="off"
                    aria-label="Buscar uma receita"
                >

            </div>

        </section>


        <!-- =========================
             CATEGORIAS
        ========================== -->

        <section class="filters-section">

            <div class="section-title">

                <h3>
                    Encontre por categoria
                </h3>

            </div>


            <div
                class="category-filters"
                id="categoryFilters"
            >

                <!--
                    O JavaScript vai criar
                    automaticamente os botões
                    das categorias encontradas
                    na planilha.
                -->

                <button
                    type="button"
                    class="category-button active"
                    data-category="Todas"
                >
                    ✨ Todas
                </button>

            </div>

        </section>


        <!-- =========================
             RECEITAS
        ========================== -->

        <section class="recipes-section">


            <div class="recipes-header">

                <h3>
                    Receitas
                </h3>

                <span id="recipeCount">
                    Carregando...
                </span>

            </div>


            <!--
                Os cards das receitas
                serão inseridos aqui
                pelo JavaScript.
            -->

            <div
                class="recipes-grid"
                id="recipesContainer"
            >

                <div class="loading">

                    <span>
                        ♡
                    </span>

                    <p>
                        Buscando nossas receitinhas...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <p>
            feito com ♡ para quem ama cozinhar
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
